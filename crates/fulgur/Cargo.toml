[package]
name = "fulgur"
version = "0.40.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTML/CSS to PDF conversion library"
readme = "../../README.md"
keywords = ["pdf", "html", "css", "converter"]
categories = ["text-processing", "command-line-utilities"]

[features]
## Enable rayon-based thread parallelism in `Engine::render_batch`.
parallel = ["dep:rayon"]
## Shape the inline layouts of a document on rayon's global pool (Blitz `parallel-construct`). Each worker shapes with a
## per-document snapshot of the document's font context, so the output does not depend on earlier documents or on the
## number of threads. Off by default: the pool needs threads (not wasm32-unknown-unknown), and the global pool is shared
## with the caller.
parallel-construct = ["blitz-dom/parallel-construct"]
## Deflate the page streams (and decode the images) on rayon's global pool (Krilla `rayon`): `Page::drop` hands the
## content stream to an idle worker instead of compressing it on the thread that draws the next page. Pages are still
## committed in order and every chunk is waited for when the document is written, so the bytes do not depend on
## scheduling. Off by default for the same reasons as `parallel-construct`.
parallel-pdf = ["krilla/rayon"]

[dependencies]
rayon = { version = "1", optional = true }
cssparser = "0.37"
krilla = "0.7.0"
krilla-svg = "0.7.0"
usvg = "0.45"
# The decoders Krilla 0.7 uses for PNG, JPEG and GIF, at the versions of its own requirements, so that
# `image::validate` reaches the verdict `Document::finish()` would (F32a).
png = "0.17.16"
gif = "0.13.1"
zune-jpeg = "0.5.5"
blitz-html = "0.2"
blitz-dom = "0.2"
blitz-traits = "0.2"
taffy = "0.9"
parley = "0.6"
skrifa = "0.44"
stylo = "0.8.0"
# The selector matcher and the URL type Stylo's selector parser takes, at the versions Blitz / Stylo already lock: the break
# reader matches rules the way the engine does (F87 review).
selectors = "0.32"
url = "2"
woff2-patched = "0.4"
thiserror = "2"
minijinja = { version = "=2.21.0", features = ["unstable_machinery"] }
serde_json = "1"
log = "0.4"
lopdf = "0.42.0"
unicode-segmentation = "1.13"
unicode-properties = "0.1"
# Force-enable `image`'s `png` feature so PNG decoding (used by blitz-dom for
# `<img>` tags and CSS background-image) works consistently across every fulgur
# build target. Without this, `blitz-dom-0.2.4`'s `image = { default-features =
# false }` makes PNG decoding depend on which other workspace member is built
# alongside fulgur, producing different page-count outputs in CLI vs WPT runner
# (fulgur-zsn8).
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }

# WASM (wasm32-unknown-unknown) build support: pulled in transitively by lopdf/rand.
# Feature unification propagates `wasm_js` to the lopdf-side dependency so the
# crate selects the `crypto.getRandomValues()` backend instead of failing with
# `compile_error!`. Browser-class targets only — WASI requires a different
# backend selection. Tracking: fulgur-iym (strategic v0.7.0).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3.27.0"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "1.1"
